[package]
name = "lmbrrr"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Metal-only crate: this is the M4 Max inference runner and Metal is the
# sole supported backend (CUDA-side work lives in the Modal Python stack).
# metal-debug-labels is the one build toggle, for kernel-debug sessions.
[features]
default = []
metal-debug-labels = [
  "candle/metal-debug-labels",
  "candle-nn/metal-debug-labels",
  "candle-transformers/metal-debug-labels",
]

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
# Fork branch `lmbrrr` carries Metal kernel additions ahead of upstream
# (i32 casts); pinned by rev, upstreamed as PRs when stable.
candle = { package = "candle-core", git = "https://github.com/tomsanbear/candle.git", rev = "70826358", features = ["metal"] }
candle-nn = { git = "https://github.com/tomsanbear/candle.git", rev = "70826358", features = ["metal"] }
candle-transformers = { git = "https://github.com/tomsanbear/candle.git", rev = "70826358", features = ["metal"] }
candle-metal-kernels = { git = "https://github.com/tomsanbear/candle.git", rev = "70826358" }
clap = { version = "4.2.4", features = ["derive"] }
crossterm = "0.28"
hf-hub = { version = "0.5.0", features = ["tokio"] }
image = { version = "0.25.2", default-features = false, features = ["jpeg", "png", "webp"] }
memmap2 = "0.9"
ratatui = "0.29"
safetensors = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "0.22.0", default-features = false, features = ["onig"] }

[dev-dependencies]
tempfile = "3"

